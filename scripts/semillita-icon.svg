<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#1B5E20"/>

  <!-- Sprout stem from head to top -->
  <line x1="512" y1="295" x2="512" y2="175" stroke="#2E7D32" stroke-width="30" stroke-linecap="round"/>

  <!-- Left leaf -->
  <path d="M512 248 C462 222 432 168 440 128 C482 134 516 182 512 248 Z" fill="#43A047"/>
  <!-- Right leaf -->
  <path d="M512 265 C562 239 592 185 584 145 C542 151 508 199 512 265 Z" fill="#43A047"/>

  <!-- Head circle -->
  <circle cx="512" cy="590" r="300" fill="#76C77A"/>
  <!-- Subtle ring -->
  <circle cx="512" cy="590" r="300" fill="none" stroke="#43A047" stroke-width="18" opacity="0.45"/>

  <!-- Cheeks -->
  <circle cx="382" cy="650" r="44" fill="#E53935" opacity="0.50"/>
  <circle cx="642" cy="650" r="44" fill="#E53935" opacity="0.50"/>

  <!-- Eyes -->
  <circle cx="438" cy="548" r="50" fill="#2E3D2B"/>
  <circle cx="586" cy="548" r="50" fill="#2E3D2B"/>
  <!-- Glints -->
  <circle cx="458" cy="526" r="17" fill="#ffffff"/>
  <circle cx="606" cy="526" r="17" fill="#ffffff"/>

  <!-- Smile -->
